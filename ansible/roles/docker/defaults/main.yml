---
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_apt_arch_map:
  x86_64: amd64
  aarch64: arm64

docker_apt_arch: "{{ docker_apt_arch_map[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"
docker_apt_distro: "{{ ansible_facts['distribution'] | lower }}"
docker_apt_url: "https://download.docker.com/linux/{{ docker_apt_distro }}"

docker_users: []
