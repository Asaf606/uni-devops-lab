---
- name: Install packages required for the Docker repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add the official Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "{{ docker_apt_url }}"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures: ["{{ docker_apt_arch }}"]
    signed_by: "{{ docker_apt_url }}/gpg"
    state: present
  register: docker_repo

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: "{{ docker_repo is changed }}"

- name: Enable and start the Docker service
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Allow deployment users to run Docker commands
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
